# The 60-second demo (§17.5).
#
# One command brings up the whole story: a publisher emitting events, a
# materializer writing them into Redis, driftwatch auditing the result
# independently, and Grafana showing the verdict. `make demo-inject-drift` then
# breaks the materializer so a visitor can watch the number go red and recover.
#
# The topology is the real one rather than a simulation. The publisher speaks
# ZMQ PUB over TCP; driftwatch and the materializer are two independent
# subscribers to it; nothing shares memory with anything else. That is the whole
# claim of the project, and a demo that faked any part of it would prove nothing.
#
#   docker compose -f deploy/demo/docker-compose.yaml up -d --build
#
# Grafana  http://localhost:3000  (anonymous, already on the dashboard)
# Prometheus http://localhost:9090
# driftwatch /metrics http://localhost:9091/metrics

name: driftwatch-demo

services:
  redis:
    image: redis:7.4-alpine
    container_name: driftwatch-demo-redis
    # No persistence: the demo is meant to be thrown away, and an AOF file
    # surviving between runs would make the second run start with a keyspace
    # the publisher never produced — which driftwatch would correctly report as
    # thousands of extra keys, and which would look like a bug in the demo.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [demo]

  publisher:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
    image: driftwatch/e2e-harness:demo
    container_name: driftwatch-demo-publisher
    command:
      - publish
      - --bind=tcp://0.0.0.0:5557
      - --topic=kv-events
      - --rate=400
      - --keys=20000
      - --publisher=replica-0
      - --status-addr=:8090
    ports:
      - "5557:5557"
    healthcheck:
      test: ["CMD", "/e2eharness", "healthcheck", "--url=http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [demo]

  materializer:
    image: driftwatch/e2e-harness:demo
    container_name: driftwatch-demo-materializer
    depends_on:
      redis: { condition: service_healthy }
      publisher: { condition: service_healthy }
    command:
      - materialize
      - --connect=tcp://publisher:5557
      - --topic=kv-events
      - --redis=redis:6379
      - --status-addr=:8090
    networks: [demo]

  driftwatch:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: driftwatch/driftwatch:demo
    container_name: driftwatch-demo-driftwatch
    depends_on:
      redis: { condition: service_healthy }
      publisher: { condition: service_healthy }
    # The CLI rather than the operator: the demo has no Kubernetes, and §11
    # requires every command to work without it. This is that requirement being
    # exercised rather than asserted.
    entrypoint: ["/driftwatch"]
    command:
      - watch
      - -f
      - /etc/driftwatch/demo.yaml
      - --metrics-addr=:9091
      - --log-format=console
      - --status-interval=15s
    volumes:
      - ./driftwatch.yaml:/etc/driftwatch/demo.yaml:ro
    ports:
      - "9091:9091"
    networks: [demo]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: driftwatch-demo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Generated by hack/prom-rules.sh, which `make demo` runs first. See the
      # comment on rule_files in prometheus.yml for why the committed custom
      # resource cannot be mounted directly.
      - ./rules.generated.yaml:/etc/prometheus/rules/driftwatch.yaml:ro
    ports:
      - "9090:9090"
    networks: [demo]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: driftwatch-demo-grafana
    depends_on: [prometheus]
    environment:
      # Anonymous admin, because a demo that opens on a login page is a demo
      # nobody gets past. This is localhost-only and thrown away afterwards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Opens straight onto the dashboard rather than the home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/driftwatch-dashboard.json
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [demo]

networks:
  demo:
    driver: bridge
