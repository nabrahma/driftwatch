{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "driftwatch.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "driftwatch.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "driftwatch.selectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
{{- if .Values.webhook.certManager.enabled }}
---
{{/*
cert-manager issues and rotates the serving certificate, and the
inject-ca-from annotations below let it fill in the caBundle the API server
needs. Without cert-manager, supply webhook.certSecretName and put the CA in
the webhook configurations yourself.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "driftwatch.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "driftwatch.labels" . | nindent 4 }}
spec:
  secretName: {{ include "driftwatch.webhookCertSecret" . }}
  dnsNames:
    - {{ include "driftwatch.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "driftwatch.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- toYaml .Values.webhook.certManager.issuerRef | nindent 4 }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "driftwatch.fullname" . }}
  labels:
    {{- include "driftwatch.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "driftwatch.fullname" . }}-webhook
  {{- end }}
webhooks:
  - name: mdriftcheck.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ include "driftwatch.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-driftwatch-io-v1alpha1-driftcheck
    rules:
      - apiGroups: ["driftwatch.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["driftchecks"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "driftwatch.fullname" . }}
  labels:
    {{- include "driftwatch.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "driftwatch.fullname" . }}-webhook
  {{- end }}
webhooks:
  - name: vdriftcheck.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ include "driftwatch.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-driftwatch-io-v1alpha1-driftcheck
    rules:
      - apiGroups: ["driftwatch.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["driftchecks"]
{{- end }}
