name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # §8.5: the declared minimum. Building on the floor is the point.
  GO_VERSION: "1.25"
  GOLANGCI_VERSION: v1.64.8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Built here rather than downloaded, because the published binary for
      # this version was compiled with Go 1.24 and golangci-lint refuses to run
      # when its own build toolchain is older than the module's go directive:
      #
      #   the Go language version (go1.24) used to build golangci-lint is lower
      #   than the targeted Go version (1.25.0)
      #
      # go install compiles it with whatever setup-go just provisioned, so the
      # two versions cannot disagree. The alternative was upgrading to
      # golangci-lint v2, which changes the config schema and is a separate
      # piece of work from getting CI green.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          golangci-lint run --timeout 5m

      # Generated files are excluded: gofumpt strips the redundant import alias
      # controller-gen emits, controller-gen puts it back, and the two would
      # take turns failing CI forever.
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          out=$(gofumpt -l -d . | grep -v 'zz_generated' || true)
          if [ -n "$out" ]; then
            echo "$out"
            echo '::error::gofumpt found unformatted files; run make fmt'
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Installed once, here, rather than inline at the first step that happens
      # to need it. hack/verify-codegen.sh runs three steps below and looks for
      # controller-gen in $(go env GOPATH)/bin and then on PATH; neither existed,
      # because the install was sitting further down next to verify-crd-docs.sh.
      #
      # go install writes to $(go env GOPATH)/bin, which is not on a runner's
      # PATH by default. Adding it to $GITHUB_PATH is what makes the binary
      # visible to every later step rather than only to the shell that ran the
      # install.
      - name: install code-generation tools
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      # Eight of thirteen scripts were committed without it, because git records
      # the mode and Windows does not have one to record. Every step that runs
      # ./hack/something.sh fails with "Permission denied" — a message that says
      # nothing about the cause and sends people looking at the script.
      - name: hack scripts are executable
        run: |
          bad=$(git ls-files -s hack/*.sh | grep -v '^100755' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo '::error::the scripts above lack the executable bit; run: git update-index --chmod=+x <file>'
            exit 1
          fi
          echo 'all hack scripts are executable'

      - name: verify no time.Sleep in tests
        run: ./hack/verify-no-sleep.sh

      - name: verify generated code is up to date
        run: ./hack/verify-codegen.sh

      - name: verify metrics documentation
        run: ./hack/verify-metrics-docs.sh

      # The CRD's descriptions are its documentation: `kubectl explain
      # driftcheck.spec.policy` renders them and nothing else. A field added
      # without a doc comment is one an operator has to read Go source to
      # configure, and nobody would notice until they tried.
      - name: verify CRD documentation and generated manifests
        run: ./hack/verify-crd-docs.sh

      - name: verify the Helm chart carries the generated CRD and RBAC
        run: |
          ./hack/sync-helm-crd.sh
          ./hack/verify-helm-rbac.sh

      # A panel querying a metric that no longer exists renders an empty graph
      # forever, which on this dashboard looks identical to healthy — half its
      # panels are green at zero.
      - name: verify the Grafana dashboard against the metric registry
        run: go run ./hack/dashboardcheck deploy/grafana/driftwatch-dashboard.json

      # The demo mounts the shipped alert rules, so a change that Prometheus
      # cannot parse breaks `make demo` rather than only the cluster.
      - name: verify the alert rules parse as a Prometheus rule file
        run: |
          ./hack/prom-rules.sh /tmp/rules.yaml
          docker run --rm -v /tmp/rules.yaml:/rules.yaml \
            --entrypoint promtool prom/prometheus:v3.1.0 check rules /rules.yaml

      - name: verify fault matrix coverage
        run: ./hack/verify-fault-matrix.sh

      - name: no skipped tests in the fault matrix
        run: |
          if grep -rn 't\.Skip' test/faults/; then
            echo '::error::a skipped fault-matrix test is a row that looks covered and is not'
            exit 1
          fi
          echo 'no skipped tests in test/faults'

  # The fault matrix is the specification of correctness under failure, and it
  # is only worth having if its answers are the same every time. Running it
  # apart from the unit suite keeps the timing visible: §20 Phase 6 budgets 120
  # seconds for all sixty rows.
  faults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: fault matrix
        run: make test-fault

      - name: fault matrix, five consecutive runs
        run: ./hack/repeat-tests.sh 5 ./test/faults/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ./internal/... sweeps up internal/controller, which needs a real API
      # server. Easy to miss, because the job is called "unit" and the package
      # that needs it is two directories down. Without this the job fails with a
      # message about envtest binaries that reads as though the controller job
      # is the broken one.
      - uses: ./.github/actions/envtest

      - name: go test -race
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out \
            ./pkg/... ./internal/... ./api/...

      # §16.9's per-package floors. Until this step existed the job produced
      # cover.out, uploaded it, and nothing read the number — and two packages
      # had quietly drifted below their floor.
      - name: coverage floors
        run: ./hack/verify-coverage.sh cover.out

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn

  # §16.1 asks for 60 seconds of fuzzing per CI run against the one property
  # that matters on untrusted input: Decode never panics. A decoder that panics
  # on a malformed frame takes down the auditor, and it does so at exactly the
  # moment the system it is auditing is misbehaving.
  #
  # The committed corpus under pkg/codec/testdata/fuzz/ is run by the unit job
  # as ordinary seeds. This job is the part that looks for something new.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: fuzz the codec
        run: make fuzz FUZZTIME=60s

      # A crash is written into testdata/fuzz/ by the toolchain. Uploading it
      # is what makes the failure actionable — without the input, "the fuzzer
      # found something" is not a bug report.
      - name: upload any crash the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: pkg/codec/testdata/fuzz/
          if-no-files-found: ignore

  # §18. Two scanners because they answer different questions: govulncheck
  # reports known vulnerabilities in Go code that is actually reachable from
  # this binary, and trivy reports them in everything else the image contains.
  #
  # Neither is allowed to fail silently. A scanner wired in and set to
  # continue-on-error is worse than no scanner, because the badge says the
  # supply chain is checked and nothing is checking it.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Reachability-based: a vulnerability in a dependency that no code path
      # here calls is reported as informational rather than as a failure, which
      # is the difference between a signal and a weekly ritual of dismissing it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: build the image
        run: docker build -t driftwatch:scan .

      # The CLI rather than aquasecurity/trivy-action, whose pinned tag stopped
      # resolving: "unable to find version 0.28.0".
      #
      # Deliberately unpinned, which is the opposite of the rule everywhere else
      # in this repository, and for a reason. A vulnerability scanner pinned to
      # a release is a scanner running last year's detection logic against this
      # year's CVEs. It is a CI tool rather than a dependency of the shipped
      # artifact, so a new version cannot reach the binary; the only thing it
      # changes is how much the scan finds.
      - name: trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version
          trivy image \
            --format sarif --output trivy.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            driftwatch:scan

      # Uploaded even when the scan failed, so the findings are readable in the
      # Security tab rather than only as a red step in a log.
      - name: upload the scan to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
        continue-on-error: true

  # The controller suite runs against a real API server and a real etcd, because
  # a fake client would let every one of its tests pass while the controller was
  # broken: fake clients do not enforce optimistic concurrency, do not run
  # finalizers, and do not validate against the CRD schema — which are three of
  # the things §10.3 asks that suite to prove.
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: ./.github/actions/envtest

      - name: controller and CRD suites
        run: go test -race -count=1 -timeout=10m ./api/... ./internal/controller/...

  # The chart is deployment surface: it renders the RBAC, the security context
  # and the CRD. All three are things that install cleanly and then misbehave if
  # they are wrong, so rendering them in CI is the only place a mistake is cheap.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: lint and render the chart
        run: |
          helm lint deploy/helm/driftwatch
          helm lint deploy/helm/driftwatch -f deploy/helm/driftwatch/values-dev.yaml
          helm lint deploy/helm/driftwatch -f deploy/helm/driftwatch/values-prod.yaml
          helm template driftwatch deploy/helm/driftwatch >/dev/null
          helm template driftwatch deploy/helm/driftwatch \
            -f deploy/helm/driftwatch/values-dev.yaml >/dev/null
          helm template driftwatch deploy/helm/driftwatch -n driftwatch-system \
            -f deploy/helm/driftwatch/values-prod.yaml >/dev/null

      # The chart refuses configurations that install cleanly and then run every
      # check twice, or serve admission without a certificate. A guard nothing
      # exercises is a guard that stops working.
      - name: the chart rejects the configurations it should
        run: |
          set +e
          helm template x deploy/helm/driftwatch \
            --set replicaCount=3 --set manager.leaderElect=false >/dev/null 2>&1
          [ $? -eq 0 ] && { echo '::error::replicas without leader election was accepted'; exit 1; }
          helm template x deploy/helm/driftwatch --set webhook.enabled=true >/dev/null 2>&1
          [ $? -eq 0 ] && { echo '::error::the webhook without a certificate was accepted'; exit 1; }
          helm template x deploy/helm/driftwatch --set rbac.scope=namespace >/dev/null 2>&1
          [ $? -eq 0 ] && { echo '::error::namespaced RBAC without a namespace was accepted'; exit 1; }
          echo 'the chart rejected all three'

  # §18: the image must have no shell, run as 65532, and hold no secret. The
  # manifests declare all of that; this is what proves the image agrees with
  # them, and it is much cheaper to catch here than in a CrashLoopBackOff.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the image
        run: docker build -t driftwatch:ci .

      - name: the image runs as 65532 with no shell
        run: |
          user=$(docker image inspect driftwatch:ci --format '{{.Config.User}}')
          [ "$user" = "65532:65532" ] || {
            echo "::error::image user is '$user', expected 65532:65532"; exit 1; }

          if docker run --rm --entrypoint /bin/sh driftwatch:ci -c 'echo reachable' 2>/dev/null; then
            echo '::error::the image has a shell in it'
            exit 1
          fi
          echo "image runs as $user with no shell"

      - name: the binary starts
        run: docker run --rm driftwatch:ci --version

  # The `inject` command sits behind a `dev` build tag so the release binary
  # cannot write to the event stream it audits (§11). Nothing else compiles it,
  # so without this job it would rot unnoticed.
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build with the dev tag
        run: go build -tags dev ./...

      - name: vet with the dev tag
        run: go vet -tags dev ./...
