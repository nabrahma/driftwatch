name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # §8.5: the declared minimum. Building on the floor is the point.
  GO_VERSION: "1.23"
  GOLANGCI_VERSION: v1.64.8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          args: --timeout 5m

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          out=$(gofumpt -l -d .)
          if [ -n "$out" ]; then
            echo "$out"
            echo '::error::gofumpt found unformatted files; run make fmt'
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: verify no time.Sleep in tests
        run: ./hack/verify-no-sleep.sh

      - name: verify generated code is up to date
        run: ./hack/verify-codegen.sh

      - name: verify metrics documentation
        run: ./hack/verify-metrics-docs.sh

      - name: verify fault matrix coverage
        run: ./hack/verify-fault-matrix.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out \
            ./pkg/... ./internal/... ./api/...

      # Per-package coverage thresholds (§16.9) are enforced from Phase 1, when
      # there is code to cover. See docs/DECISIONS.md ADR-0007.

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn

  # The `inject` command sits behind a `dev` build tag so the release binary
  # cannot write to the event stream it audits (§11). Nothing else compiles it,
  # so without this job it would rot unnoticed.
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build with the dev tag
        run: go build -tags dev ./...

      - name: vet with the dev tag
        run: go vet -tags dev ./...
