name: e2e

# A separate workflow from ci, per §17.2, and the reason is failure isolation
# rather than tidiness. This job needs Docker, a Kind cluster and about eight
# minutes; ci needs none of that and finishes in two. Merging them would mean a
# containerd hiccup blocking a documentation change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # §14.5 budgets eight minutes for the scenarios on a 2-core runner. Twenty
    # covers the cluster, two image builds and the loads on top of that, and
    # still fails rather than hanging if something deadlocks.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # The suite creates its own cluster — §14.5 requires `make e2e` to work
      # from a clean clone with only Docker and Go, and a workflow that created
      # the cluster for it would be testing a path nobody else uses. kind is
      # installed rather than run, so the binary is present when kind.go looks
      # for it.
      - name: install kind
        uses: helm/kind-action@v1
        with:
          version: v0.26.0
          install_only: true

      - name: e2e
        run: make e2e

      # Always, not only on failure. §14.3 makes the diagnostics an explicit
      # deliverable, and a passing run's artifacts are what the next failure gets
      # compared against.
      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_number }}
          path: test/e2e/_artifacts/
          retention-days: 14
          if-no-files-found: ignore

      # The context is checked first because the suite tears the cluster down on
      # its way out unless DRIFTWATCH_E2E_KEEP is set. When the failure is the
      # cluster never coming up, every command below then fails on a context
      # that does not exist, and the step fills with errors about kubectl rather
      # than with anything about driftwatch.
      - name: cluster state on failure
        if: failure()
        run: |
          ctx=kind-driftwatch-e2e
          if ! kubectl config get-contexts -o name | grep -qx "$ctx"; then
            echo "no $ctx context; the cluster was never created or is already gone"
            exit 0
          fi

          kubectl --context "$ctx" get pods -A -o wide || true
          kubectl --context "$ctx" get driftchecks -A -o wide || true
          kubectl --context "$ctx" -n driftwatch-system \
            logs -l app.kubernetes.io/name=driftwatch --tail=200 || true

          # Previous-container logs exist only if the manager restarted, so a
          # non-zero exit here is the ordinary case rather than a problem. The
          # suite's own collector reported it as "04-manager-previous.log: exit
          # status 1", which reads like a broken diagnostic.
          for pod in $(kubectl --context "$ctx" -n driftwatch-system \
              get pods -l app.kubernetes.io/name=driftwatch -o name); do
            if kubectl --context "$ctx" -n driftwatch-system \
                logs --previous "$pod" --tail=200 2>/dev/null; then
              echo "(above: previous container for $pod, so it restarted)"
            else
              echo "no previous container for $pod, so it did not restart"
            fi
          done

  # §16.5, against real Redis 6 and 7. This job existed as a Makefile target and
  # a passing test file that no workflow ever ran, which is the same as not
  # having it: every early finding here was a place where miniredis and a real
  # server disagreed, and a suite that only runs locally catches those only when
  # somebody remembers to look.
  #
  # No service containers. The suite drives testcontainers-go and starts both
  # versions itself, so declaring them here would start four servers and test
  # two. Docker is already present on ubuntu-latest, which is the only thing it
  # needs.
  #
  # Here rather than in ci.yaml for the same reason the e2e job is: it wants a
  # working Docker daemon and pulls images, and a registry hiccup should not
  # block a documentation change.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: report the versions under test
        # Printed rather than assumed. When this job fails on one version and
        # not the other, the first question is which server was actually
        # running, and the answer should not require reading the test source.
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          grep -A4 'redisVersions = ' pkg/target/redis_integration_test.go

      - name: integration
        run: make test-integration

  # Wire compatibility with real libzmq (§16.6). Its own job because it needs a
  # Python toolchain and nothing else in the repository does, and because it
  # takes three seconds — there is no reason for it to wait behind a cluster.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install pyzmq
        # The wheel bundles a real libzmq, which is the whole point: this has to
        # test against the C implementation rather than a second copy of the Go
        # one.
        run: python -m pip install --quiet pyzmq

      - name: report the libzmq version under test
        run: python -c "import zmq; print('pyzmq', zmq.__version__, 'libzmq', zmq.zmq_version())"

      - name: interop
        run: make test-interop
