apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # manifests.yaml is generated from the kubebuilder markers in
  # api/v1alpha1/driftcheck_webhook.go and committed alongside the RBAC, so the
  # admission surface is reviewable without running controller-gen.
  - manifests.yaml
  - service.yaml

configurations:
  - kustomizeconfig.yaml
