apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftwatch-manager
  namespace: system
# No token is mounted by anything but the manager itself, and the manager only
# ever talks to the API server. driftwatch makes no outbound call to anywhere it
# was not configured to reach: no telemetry, no phone-home, no update check
# (§18).
automountServiceAccountToken: true
